---
# Playbook 1: configure the server and install a Kubernetes cluster (k3s)
- name: Prepare the EC2 host and install Kubernetes (k3s)
  hosts: k8s_host
  become: true
  tasks:
    - name: Update apt cache and install base packages
      ansible.builtin.apt:
        name: [curl, git, ca-certificates]
        state: present
        update_cache: true

    - name: Install k3s (single-node Kubernetes)
      ansible.builtin.shell: |
        set -o pipefail
        curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --write-kubeconfig-mode 644" sh -
      args:
        executable: /bin/bash
        creates: /usr/local/bin/k3s

    - name: Make sure the k3s service is enabled and running
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true

    - name: Wait until the node is Ready
      ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=30s
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: node_ready
      until: node_ready.rc == 0
      retries: 12
      delay: 10
      changed_when: false

    - name: Show cluster nodes
      ansible.builtin.command: kubectl get nodes -o wide
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: nodes
      changed_when: false

    - name: Print nodes
      ansible.builtin.debug:
        var: nodes.stdout_lines
